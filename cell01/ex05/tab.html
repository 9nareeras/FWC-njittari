<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
</head>

<body>

    <table style="
        width: 100%;
        border-collapse: collapse;
        height: 100px;
    ">
        <tr>
            <td style="
                background-color: lightblue;
                border: 1px solid black;
                width: 50%;
            ">
                Boy
            </td>

            <td style="
                background-color: lightpink;
                border: 1px solid black;
                width: 50%;
            ">
                Girl
            </td>
        </tr>
    </table>

</body>
</html>
