<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            width: 50%;
            border: 1px solid black;
            padding: 10px;
        }

        .first {
            background-color: lightblue;
        }

        .second {
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <table style="
        width: 100%;
        border-collapse: collapse;
        height: 100px;
    ">
        <tr>
            <td style="
                background-color: lightblue;
                border: 1px solid black;
                width: 50%;
            ">
                Boy
            </td>

            <td style="
                background-color: lightpink;
                border: 1px solid black;
                width: 50%;
            ">
                Girl
            </td>
        </tr>
    </table>

</body>
</html>
